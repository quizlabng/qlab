[project]
name = "qlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taofeek Abdulazeez", email = "taofeekabdulazeez2020@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.5",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-openrouter>=0.2.8",
    "langchain-redis>=0.2.5",
    "langchain-text-splitters>=1.1.2",
    "redis>=7.4.1",
]

[project.scripts]
qlab = "qlab:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "src.qlab.main:app"
